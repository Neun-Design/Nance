name: Deploy Stakeholder Docs to GitHub Pages

on:
  push:
    branches:
      - docs/stakeholder
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-mkdocs-material
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install MkDocs and Material theme
        run: pip install "mkdocs>=1.6" "mkdocs-material>=9.6"

      - name: Build MkDocs site
        working-directory: site-stakeholder
        run: mkdocs build

      # The prototype (app/ + app/mvp/) lives in the same gh-pages branch as
      # the docs root. Carrying it into the build output lets the deploy below
      # do a full replace — retired doc pages stop lingering as orphans —
      # without wiping the app.
      - name: Carry over the prototype app from gh-pages
        run: |
          git fetch origin gh-pages || exit 0
          if [ -n "$(git ls-tree origin/gh-pages app)" ]; then
            git archive origin/gh-pages app | tar -x -C site-stakeholder/site
          fi

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: site-stakeholder/site
          publish_branch: gh-pages
          commit_message: "docs: deploy stakeholder site from ${{ github.sha }}"
