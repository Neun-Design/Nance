name: Validate PR

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
    branches:
      - main

permissions:
  pull-requests: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check branch name and PR title
        uses: actions/github-script@v7
        with:
          script: |
            const branch = context.payload.pull_request.head.ref;
            const title  = context.payload.pull_request.title;

            const branchOk = /^(feat|fix|docs|design|data|chore)\/[a-z0-9-]+(\/[a-z0-9-]+)?$/.test(branch);
            const titleOk  = /^(feat|fix|docs|design|data|chore|refactor|test|ci|style|perf|revert)(\([a-z0-9-]+\))?: .+/.test(title);

            const errors = [];
            if (!branchOk) errors.push(
              `**Branch name \`${branch}\` is invalid.**\n` +
              'Expected pattern: `<type>/<scope>/<slug>` — e.g. `feat/prototype/add-quality-module`\n' +
              'Allowed types: `feat` `fix` `docs` `design` `data` `chore`'
            );
            if (!titleOk) errors.push(
              `**PR title \`${title}\` does not follow Conventional Commits.**\n` +
              'Expected: `type(scope): short description` — e.g. `feat(prototype): add quality module`\n' +
              'Allowed types: `feat` `fix` `docs` `design` `data` `chore` `refactor` `test` `ci` `style` `perf` `revert`'
            );

            if (errors.length) {
              const body = [
                '## PR Validation — action required',
                '',
                ...errors.map(e => `- ${e}`),
                '',
                'Fix the branch name or PR title and re-push to clear this check.',
              ].join('\n');

              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo:  context.repo.repo,
                issue_number: context.payload.pull_request.number,
                body,
              });

              core.setFailed('PR validation failed — see comment for details.');
            }

  # BDD-first advisory (issue #475): behavior surfaces changed without any
  # .feature change get ONE reminder comment pointing at the /bdd-workflow
  # evaluate phase. Never blocking — "no BDD impact" is a legitimate verdict
  # that lives in the round's issue.
  bdd-impact:
    runs-on: ubuntu-latest
    steps:
      - name: Advisory — behavior changed without a .feature
        uses: actions/github-script@v7
        with:
          script: |
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
              per_page: 100,
            });
            const names = files.map((f) => f.filename);
            const behavior = names.filter((n) =>
              n.startsWith('packages/spec/src/modules/') || n.startsWith('prototype/js/'));
            const hasFeature = names.some((n) => n.startsWith('packages/bdd/features/'));
            const marker = '<!-- bdd-impact-advisory -->';

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              per_page: 100,
            });
            const mine = comments.find((c) => c.body && c.body.includes(marker));

            if (behavior.length && !hasFeature) {
              const listed = behavior.slice(0, 10).map((n) => `- \`${n}\``);
              if (behavior.length > 10) listed.push(`- …and ${behavior.length - 10} more`);
              const body = [
                marker,
                '## BDD impact — advisory (not blocking)',
                '',
                'This PR touches behavior surfaces without changing any `.feature`:',
                ...listed,
                '',
                'Per the BDD-first law (`/bdd-workflow`, issue #473): confirm the round issue',
                'records the **evaluate** verdict. "No BDD impact" is a legitimate outcome —',
                'this comment is a reminder, not a gate.',
              ].join('\n');
              if (mine) {
                await github.rest.issues.updateComment({
                  owner: context.repo.owner, repo: context.repo.repo,
                  comment_id: mine.id, body,
                });
              } else {
                await github.rest.issues.createComment({
                  owner: context.repo.owner, repo: context.repo.repo,
                  issue_number: context.payload.pull_request.number, body,
                });
              }
            } else if (mine) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner, repo: context.repo.repo,
                comment_id: mine.id,
                body: `${marker}\n## BDD impact — resolved\n\nA \`.feature\` change landed, or no behavior surface is touched anymore.`,
              });
            }
