name: Deploy Prototype to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - "prototype/**"
  workflow_dispatch:

# Serialize every gh-pages writer (shared with deploy-stakeholder.yml):
# overlapping runs race on the branch head — the later checkout pushes
# non-fast-forward and is rejected (issue #209, PRs #206+#208 merged 3s
# apart). cancel-in-progress stays false so the running deploy finishes
# and only the newest pending run stays queued.
concurrency:
  group: gh-pages
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # MVP walkthrough (ux-review U8): the SAME app served under /app/mvp/ —
      # data.js detects the /mvp/ path and boots blank. Staging both copies
      # here keeps them in lockstep (drifted on 2026-08-13: five schema
      # versions stale until a manual ./deploy_pages.sh run).
      - name: Assemble app + mvp mirror
        run: |
          cp -R prototype stage
          cp -R prototype stage/mvp

      # Full replace scoped to app/ — no keep_files. With keep_files: true,
      # files DELETED from prototype/ stayed published forever (issue #237:
      # login.js with the old demo credentials outlived the login-gate
      # removal and needed a manual gh-pages cleanup). The action's cleanup
      # is `git rm -r *` inside destination_dir only, so the stakeholder
      # docs at the branch root are untouched.
      - name: Deploy prototype + MVP to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: stage
          publish_branch: gh-pages
          destination_dir: app
          commit_message: "deploy: prototype + mvp from ${{ github.sha }}"
