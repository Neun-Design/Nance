name: Deploy Prototype to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - "prototype/**"
  workflow_dispatch:

# Serialize every gh-pages writer (shared with deploy-stakeholder.yml):
# overlapping runs race on the branch head — the later checkout pushes
# non-fast-forward and is rejected (issue #209, PRs #206+#208 merged 3s
# apart). cancel-in-progress stays false so the running deploy finishes
# and only the newest pending run stays queued.
concurrency:
  group: gh-pages
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy prototype to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: prototype
          publish_branch: gh-pages
          destination_dir: app
          keep_files: true
          commit_message: "deploy: prototype from ${{ github.sha }}"

      # MVP walkthrough (ux-review U8): the SAME app served under /app/mvp/ —
      # data.js detects the /mvp/ path and boots blank. It is a separate full
      # copy on gh-pages, so it must deploy too or it drifts behind /app/
      # (bit us on 2026-08-13: five schema versions stale until a manual
      # ./deploy_pages.sh run).
      - name: Deploy MVP walkthrough copy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: prototype
          publish_branch: gh-pages
          destination_dir: app/mvp
          keep_files: true
          commit_message: "deploy: mvp walkthrough from ${{ github.sha }}"
