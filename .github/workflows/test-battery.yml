name: Test Battery

# Runs the full engine proof battery + the mockup parity validator on every
# change that can affect the prototype (Rafael's eligibility round): the
# eligibility contracts — ticket→procedure dispatch (redundancy hint,
# Approved-only, live re-evaluation on new requirements) and user staffing
# (onboarding → competence → procedures) — are guarded by
# test_engine_ticket_procedure_eligibility.mjs and
# test_engine_user_eligibility.mjs inside the same battery.

on:
  push:
    branches: [main]
    paths:
      - 'prototype/**'
      - 'packages/spec/**'
      - 'packages/bdd/**'
      - 'site-stakeholder/api/**'
      - '.github/workflows/test-battery.yml'
  pull_request:
    branches: [main]
    paths:
      - 'prototype/**'
      - 'packages/spec/**'
      - 'packages/bdd/**'
      - 'site-stakeholder/api/**'
      - '.github/workflows/test-battery.yml'

jobs:
  # ADR-0002: the datamodel is compiled from packages/spec. This job is the
  # drift guard — the committed prototype/data/datamodel.json must equal the
  # spec's output, so hand edits to a migrated module (or a stale build) fail
  # here before the engine battery runs against the artifact.
  spec:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/spec
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: packages/spec/package-lock.json
      - name: Install
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Spec tests (equivalence + merge semantics)
        run: npm test
      - name: Build datamodel.json from the spec
        run: npm run build
      - name: Drift guard — committed artifact must equal the spec output
        run: git diff --exit-code -- ../../prototype/data/datamodel.json

  battery:
    needs: spec
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: prototype
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install validator dependencies
        run: pip install pyyaml
      - name: Engine proof battery
        run: |
          fails=0; total=0
          for t in tools/test_*.mjs; do
            total=$((total+1))
            if ! node "$t" > /tmp/suite.log 2>&1; then
              fails=$((fails+1))
              echo "::error::FAIL $t"
              cat /tmp/suite.log
            fi
          done
          echo "battery: $((total-fails))/$total green"
          test "$fails" -eq 0
      - name: Mockup parity validator
        run: python3 tools/validate_mockup.py

  # BDD layer (issue #473): Gherkin features per module in packages/bdd.
  # Engine scenarios import the prototype engine headless (same fetch-mock
  # pattern as the proof battery); @api scenarios hit a locally-booted chat
  # API. The dummy ANTHROPIC_API_KEY is safe: every @api scenario exercises
  # only the paths that fail BEFORE the Anthropic client is called.
  bdd:
    needs: spec
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/bdd
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: packages/bdd/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: npm ci
      - name: Engine + report scenarios
        run: npm run test:engine
      - name: Install chat API dependencies
        run: pip install fastapi uvicorn anthropic python-dotenv
      - name: Boot chat API (dummy key, tight rate limit)
        run: |
          ANTHROPIC_API_KEY=dummy \
          EDQMS_RATE_LIMIT_REQUESTS=5 \
          EDQMS_RATE_LIMIT_WINDOW_SECONDS=60 \
            python3 -m uvicorn server:app --app-dir ../../site-stakeholder/api --port 8777 \
            > /tmp/uvicorn.log 2>&1 &
          echo $! > /tmp/uvicorn.pid
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8777/healthz > /dev/null && exit 0
            sleep 1
          done
          echo "::error::chat API never came up"; cat /tmp/uvicorn.log; exit 1
      - name: API contract scenarios
        run: npm run test:api
      - name: Teardown chat API
        if: always()
        run: kill "$(cat /tmp/uvicorn.pid)" 2>/dev/null || true
