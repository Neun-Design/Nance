<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nance Governance Portal</title>

  <!-- nance Design System tokens (source of truth for all styling).
       Includes a compatibility layer mapping legacy --se-* names to --n-*. -->
  <link rel="stylesheet" href="assets/tokens/nance-tokens.css">
  <link rel="stylesheet" href="assets/app.css">

  <script src="vendor/echarts.min.js"></script>
</head>
<body>
  <div class="app">
    <!-- ========== HEADER ========== -->
    <header class="app-header">
      <div class="brand">
        <div class="brand-mark">VG</div>
        <div class="brand-title">VITALIS GOVERNANCE PORTAL</div>
        <div class="header-badge" title="Fictitious demonstration data — non-persistent, resets on reload">DEMO DATA · VITALIS</div>
        <span class="brand-sub">EDQMS · ISO 9001:2015</span>
        <button class="about-btn" id="about-demo" type="button" title="What this demonstration shows">About this demo</button>
      </div>
      <div class="header-right">
        <div class="header-search">
          <input type="search" id="global-search" placeholder="Search this tab…" autocomplete="off">
        </div>
        <div class="avatar" id="avatar" title="Quality Manager">QM</div>
      </div>
    </header>

    <div class="app-body">
      <!-- ========== SIDEBAR ========== -->
      <nav class="sidebar" id="sidebar"><!-- modules injected by app.js --></nav>

      <!-- ========== MAIN ========== -->
      <main class="main" id="main">
        <div class="tab-scroll" id="tab-scroll"><!-- tabs injected --></div>
        <div class="tab-view" id="tab-view"><!-- active tab content injected --></div>
      </main>
    </div>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
