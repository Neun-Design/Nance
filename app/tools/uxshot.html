<!DOCTYPE html>
<!-- uxshot.html — headless-Chrome screenshot driver for UI review sessions.
     Serve prototype/ over http, then:
       chrome --headless=new --window-size=1680,1050 --virtual-time-budget=15000 \
         --screenshot=out.png "http://localhost:8123/tools/uxshot.html?hash=/1/0&act=expand"
     Params: hash=/<module>/<tab> route · auth=0 keeps the login gate ·
     act=expand|form|filters|edit · sub=<n> clicks the n-th subitem tab after expand ·
     app=<query> forwards a query string to the app (app=data%3Dempty for MVP mode). -->
<html><body style="margin:0;background:#000">
<iframe id="f" style="width:100vw;height:100vh;border:0"></iframe>
<script>
  const q = new URLSearchParams(location.search);
  if (q.get('auth') !== '0') sessionStorage.setItem('edqms-auth', '1');
  const f = document.getElementById('f');
  f.src = '/index.html' + (q.get('app') ? '?' + q.get('app') : '')
    + (q.get('hash') ? '#' + q.get('hash') : '');
  const act = q.get('act');
  const clickIn = (sel, idx = 0) => {
    const n = f.contentDocument.querySelectorAll(sel)[idx];
    if (n) n.click();
    return !!n;
  };
  let tries = 0;
  const run = () => {
    tries += 1;
    const d = f.contentDocument;
    const ready = d && d.querySelector('#tab-body table.dt, .login-card, .kpi-grid');
    if (!ready && tries < 60) return setTimeout(run, 250);
    if (act === 'expand') {
      clickIn('.rollup-toggle');
      if (q.get('sub')) setTimeout(() => clickIn('.subtab', Number(q.get('sub'))), 400);
    } else if (act === 'form') {
      const b = [...d.querySelectorAll('.btn-primary')].find((x) => /New Item/.test(x.textContent));
      if (b) b.click();
    } else if (act === 'filters') {
      const b = [...d.querySelectorAll('.btn-secondary')].find((x) => x.textContent === 'Filters');
      if (b) b.click();
    } else if (act === 'edit') {
      const row = d.querySelector('#tab-body table.dt tbody tr.row-clickable');
      if (row) row.click();
    }
  };
  f.addEventListener('load', () => setTimeout(run, 600));
</script>
</body></html>
