# Layer 7 — Competence & Onboarding (certification is THE Talent story here)
# ===========================================================================

competences:
  count: 28
  note: >
    1:1 with a procedure (issue #231 doctrine): "certified to run SOP-014
    (CT contrast acquisition, adult protocol)". Product scope = the pair the
    procedure serves. The certification story (story 2) plants a NEW
    tomography protocol with only 2 certified people.

onboardings:
  count: 60
  certifiedRate: 0.75              # story 2 needs a visible uncertified cohort
  note: >
    Group semantics (issue #239): one onboarding certifies a GROUP of
    competences under a title — "CT Suite Certification — Campinas",
    "Molecular Bench Qualification". Titles name the group, not the person.

# ===========================================================================
# Layer 8 — Execution (Projects → Tickets → Jobs) — DERIVED, not drawn
# ===========================================================================

projects:                          # 10 — contracts/campaigns as containers
  - { name: HealthFirst 2026 Service Contract, customer: HealthFirst Insurance }
  - { name: MedCare Plus Imaging Program, customer: MedCare Plus }
  - { name: Austral Cross-Border Coverage, customer: Austral Seguros Médicos }
  - { name: Winter Respiratory Campaign, customer: Vitalis Screening Program }
  - { name: Pink October Screening Drive, customer: Vitalis Screening Program }
  - { name: São Lucas Overflow Agreement, customer: São Lucas General Hospital }
  - { name: Corporate Checkup Season, customer: Corporate Care Group }
  - { name: Home Collection Rollout, customer: Vitalis Home Collection }
  - { name: Palermo Unit Ramp-up, customer: Vitalis Palermo Clinic }
  - { name: Accreditation Renewal 2026, customer: Vitalis Paulista Clinic }

tickets:                           # 160 — the exam/service requests
  count: 160
  linkedToForecastRate: 0.60       # ≥55% hygiene floor; ≈96 tickets consume demand lines
  linkSpreadMin: 60                # across ≥60 distinct lines (no 2-line concentration)
  statusMix: { Open: 0.15, InProgress: 0.25, Resolved: 0.6 }
  note: "A ticket is the exam/service request under a project — NEVER a patient record."

jobs:                              # 240 — person-level execution with real lifecycle
  count: 240
  statusMix: { Done: 0.55, Active: 0.2, Queued: 0.2, Stoped: 0.05 }
  doneMonthsSpread: 12             # ≥10 months of completions (validator)
  dependencyChainRate: 0.4         # predecessorJobID finish-to-start within tickets
  note: >
    plannedExecutionTime frozen from the task's procedures (issue #244);
    realExecutionTime only on Done, equation closed (elapsed − buffer);
    Stoped rows carry stoppedAt + buffer > 0; NO real date after the anchor.
    Radiologist jobs at Vitalis Campinas overshoot plan in the last 3 months
    (story 1); HealthFirst jobs consume 1180 h against 900 approved (story 4).

