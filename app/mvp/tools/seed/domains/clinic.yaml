    slaCode pattern "VHN-{year}-{n:03d}".

forecasts:                         # SLA 1:N Forecasts — one per period per contract
  monthly: 144                     # 12 contracts × 12 months
  quarterly: 8                     # 2 contracts × 4 quarters (real mass, plan §7.1)
  annual: 4                        # 4 contracts × 1 year
  statusMix: { Approved: 0.75, Submitted: 0.1, Draft: 0.1, Archived: 0.05 }  # ≥3 Draft (validator)

forecastScopes:                    # 360 demand lines: contracted pair + FUNCTION + quantity
  count: 360
  perForecast: { min: 2, max: 3 }
  quantity: { min: 1, max: 40 }    # exams of that pair projected for the period
  note: >
    Each line = one contracted "Exam × Scope" pair (a product scope packaged
    by the SLA's payloads — R6 narrowing) plus the FUNCTION whose hours it
    projects: "Radiologist hours for urgent CT" (story-4 vocabulary).
    estimatedHours = chained task hours × quantity where the event chains
    tasks; the generator PLANTS full chains so no manual-fallback rows exist
    in the clinic dataset (unlike the migrated transformer data).

