# clinic.yaml — Vitalis Health Network domain pack (MOCKUP_DEMO_PLAN.md F1)
# ---------------------------------------------------------------------------
# The domain dictionary + generation parameters for the public-demo dataset:
# a fictitious network of diagnostic-imaging and clinical-analysis clinics.
# Consumed by tools/seed/build_seed.py (F2). Every catalogue table of
# data/datamodel.json has an entry here — the F1 acceptance rule ("no table
# left over"). Capacity and Performance are deliberately ABSENT from the
# vocabulary: they are outputs of tools/derive_control.py (R6, issue #246),
# never dictionary material (plan §10, note 3).
#
# Session decisions baked in (21/08/2026):
#   - network scale: 12 branches across Brazil + Argentina (2 countries)
#   - brand: neutralized — "Vitalis Governance Portal"; SE design tokens stay
#   - data language: English; names 100% fictitious; e-mails @example.com
#
# Post-R6 semantics this dictionary is written against (plan "próximo passo"):
#   - SLA = THE INSURER CONTRACT: which exams (product scopes) are covered,
#     at which unit/department — and the parent of Forecasts (SLA 1:N).
#   - Forecast Scope = one CONTRACTED "Exam × Scope" pair (a payload product
#     scope) plus the FUNCTION that executes it — "radiologist hours for
#     urgent CT" is exactly how a clinic manager talks.
#   - Jobs/Tickets close the demand→execution→consumption cycle (issue #243).

meta:
  domain: clinic
  organization: Vitalis Health Network
  portalTitle: Vitalis Governance Portal          # header (brand neutralized)
  headerBadge: "DEMO DATA · Vitalis Health Network"
  brandMark: VG
  language: en
  seed: 20260821                                  # random.Random(seed) — determinism
  anchorDate: 2026-08-21                          # _meta.anchorDate; dates stored as offsets
  monthsOfHistory: 12
  about: >
    Vitalis Health Network is a fictitious chain of diagnostic-imaging and
    clinical-analysis clinics. Its Clinical Operations & Quality division
    standardizes how every exam is performed, certifies who may perform it,
    projects demand per insurer contract and measures what was actually
    consumed. All data is fictitious, generated for demonstration. The
    platform itself was born in an industrial engineering division and is
    sector-agnostic.

  # Validator fixture counts (plan §5.5 — FIX moves from validate_mockup.py
  # to the domain pack). The generator writes them; the validator reads them.
  fixtures:
    Customers: 18
    Actions: 8
    Scopes: 8
    Products: 12
    Product Groups: 14
    Product Specs: 8
    Events: 20
    Tickets: 160

  # Seed hygiene the generator must guarantee BY CONSTRUCTION (plan §7.1 —
  # each line also becomes an assert in the validator's `== narrative ==`).
  hygiene:
    ticketLinkRate: 0.55            # ≥55% of tickets consume a demand line…
    ticketLinkSpreadMin: 60         # …spread over ≥60 distinct forecast scopes
    consumptionWithinQuantity: true # consumption ≤ forecastScopeQuantity per line
    noRealDatesAfterAnchor: true    # in ANY job status
    realTimeOnlyOnDone: true        # realExecutionTime ⇒ jobStatus = Done
    stopedShape: true               # Stoped ⇒ stoppedAt set, buffer > 0, no realEndDate
    forecastPeriodMasses: { Month: 144, Quarter: 8, Annual: 4 }

