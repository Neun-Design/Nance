slas:                              # 20 contracts — THE CONTRACT entity (SLA-as-Contract, R6)
  count: 20
  withForecasts: 14                # 12–16 per plan §7 — the temporal dimension
  note: >
    One or two contracts per major customer with a department: e.g.
    "HealthFirst × Radiology Operations" covers the urgent and routine CT/MRI
    payloads; "Vitalis Screening Program × Radiology Operations" covers the
    mammography campaign payload; lab insurers contract with Laboratory
