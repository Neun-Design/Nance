# ===========================================================================
# Layer 5 — Process (Processes → Workflows → Activities × Actions → Tasks)
# ===========================================================================

actions:                           # 8 — recurring across processes feeds story 5
  - Approval
  - Assignment
  - Execution
  - Check
  - Followup
  - Registration
  - Release
  - Escalation

processes:
  - name: Imaging Exam Flow
    description: "From medical order to released report for an imaging exam"
    activities: [Schedule Exam, Prepare Patient, Acquire Images, Elaborate Report, Release Results]
  - name: Laboratory Sample Flow
    description: "From sample reception to validated result release"
    activities: [Receive Samples, Process Samples, Validate Results, Release Results]
  - name: Urgent Care Lane
    description: "Priority path for flagged urgent orders"
    activities: [Triage Order, Acquire Images, Elaborate Report, Notify Physician]
  - name: Second Opinion Flow
    description: "Independent re-read of an existing exam"
    activities: [Retrieve Prior Study, Re-read Study, Reconcile Findings]
  - name: Quality Audit Flow
    description: "Sampling, re-check and corrective follow-up of released work"
    activities: [Sample Cases, Re-check Reports, Log Findings, Follow Corrective Actions]
  - name: Home Collection Flow
    description: "Route planning, collection and sample hand-off at the lab"
    activities: [Plan Route, Collect At Home, Transport Samples]
  # ~22 activities total across the six processes; workflows (24) order them
  # with the STEPORDER rules — acquisition steps sequential, QA checks parallel.

tasks:
  count: 48                        # taskName = "<activityName>-<actionName>" (issue #214 convention)
  note: >
    Generated as Activity × Action combinations that make clinical sense —
    e.g. "Acquire Images-Execution", "Elaborate Report-Check", "Release
    Results-Approval". The Check and Followup actions recur across at least
    3 processes (story 5 anchor: "Elaborate Report-Check" exists in Imaging
    Exam Flow, Urgent Care Lane and Second Opinion Flow).

procedures:                        # the documented method + time — base of ALL capacity math
  count: 52
  executionTimeHours: { min: 0.5, max: 4.0, step: 0.25 }
  registryPattern: "SOP-{n:03d}"
  note: >
    One-plus procedure per task; requirement sets bind HERE (Procedures
    doctrine, 2026-08-03): the urgent variants carry Report Double Signature,
    contrast tasks carry Contrast Administration Protocol, lab tasks carry
    ISO 15189. Wildcard (empty requirement set) procedures exist for generic
    tasks. executionTime examples: CT acquisition 0.75 h, MRI sedation 1.5 h,
    report elaboration 0.5 h, campaign batch reading 4.0 h.

handouts:                          # 14 controlled documents
  - Medical Order
  - Signed Report
  - Acquisition Protocol Sheet
  - Contrast Consent Form
  - Sedation Consent Form
